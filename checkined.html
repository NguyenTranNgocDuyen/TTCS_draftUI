<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Chấm công</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #2f80ed, #56ccf2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #f2f2f2;
            padding: 30px;
            border-radius: 20px;
            width: 420px;
            text-align: center;
        }

        .time {
            font-size: 40px;
            color: #4a6cf7;
            font-weight: bold;
        }

        .status {
            margin: 10px 0;
            padding: 6px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        .status.red {
            background: #ffd6d6;
            color: red;
        }

        .status.green {
            background: #d4edda;
            color: green;
        }

        .info {
            background: #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
        }

        .btn-checkin {
            background: #28a745;
            color: white;
        }

        .btn-checkout {
            background: #dc3545;
            color: white;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Chấm Công Hôm Nay</h2>

        <div class="time" id="clock"></div>

        <div id="status" class="status red">● Chưa Check In</div>

        <div class="info">
            <p><b>Giờ Check In:</b> <span id="checkinTime">--:--</span></p>
            <p><b>Thời gian làm việc:</b> <span id="workingTime">00:00:00</span></p>
        </div>

        <button id="actionBtn" class="btn btn-checkin" onclick="handleAction()">Check In</button>
    </div>

    <script>
        let isCheckedIn = false;
        let checkInTimestamp = null;

        // CLOCK REALTIME
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();

            let ampm = h >= 12 ? "PM" : "AM";
            h = h % 12 || 12;

            document.getElementById("clock").innerHTML =
                `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')} ${ampm}`;

            // Nếu đã check-in → cập nhật working time
            if (isCheckedIn) {
                const diff = Math.floor((Date.now() - checkInTimestamp) / 1000);

                let hh = Math.floor(diff / 3600);
                let mm = Math.floor((diff % 3600) / 60);
                let ss = diff % 60;

                document.getElementById("workingTime").innerText =
                    `${hh.toString().padStart(2, '0')}:${mm.toString().padStart(2, '0')}:${ss.toString().padStart(2, '0')}`;
            }
        }

        setInterval(updateClock, 1000);
        updateClock();

        // HANDLE BUTTON
        function handleAction() {
            if (!isCheckedIn) {
                checkIn();
            } else {
                checkOut();
            }
        }

        // SCENE 4: CHECK-IN
        function checkIn() {
            isCheckedIn = true;
            checkInTimestamp = Date.now();

            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();

            document.getElementById("checkinTime").innerText =
                `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

            // UI update
            document.getElementById("status").innerText = "● Đã Check In";
            document.getElementById("status").className = "status green";

            const btn = document.getElementById("actionBtn");
            btn.innerText = "Check Out";
            btn.className = "btn btn-checkout";
        }

        // (Preview) Scene 5/6
        function checkOut() {
            alert("Sẽ chuyển sang Scene xác nhận Check-out (UC tiếp theo)");
        }
    </script>

</body>

</html>
