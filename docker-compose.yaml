version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timesheet-backend
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: timesheet-frontend
    ports:
      - "8080:80" # Docker UI: http://localhost:8080, keeps 5173 free for Vite dev
    env_file:
      - ./frontend/.env
    environment:
      - VITE_TZ=${VITE_TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      - backend
    restart: unless-stopped
