<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f6fa;
        }

        /* HEADER */
        .header {
            background: #1e293b;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: #0f172a;
            color: white;
            position: fixed;
        }

        .sidebar h2 {
            padding: 20px;
        }

        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: #cbd5e1;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #1e293b;
            color: white;
        }

        /* CONTENT */
        .content {
            margin-left: 240px;
            padding: 20px;
        }

        /* CARDS */
        .cards {
            display: flex;
            gap: 20px;
        }

        .card {
            background: white;
            flex: 1;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        /* TABLE */
        .table {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td,
        th {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <div class="header">
        <div>Timesheet System</div>
        <div>Xin chào, Admin</div>
    </div>

    <div class="sidebar">
        <h2>Admin</h2>
        <a href="#">Dashboard</a>
        <a href="#">Duyệt Timesheet</a>
        <a href="#">Duyệt nghỉ phép</a>
        <a href="#">Quản lý nhân viên</a>
        <a href="#">Báo cáo</a>
    </div>

    <div class="content">

        <h2>Dashboard</h2>

        <div class="cards">
            <div class="card">
                <h3>Nhân viên</h3>
                <h1>25</h1>
            </div>
            <div class="card">
                <h3>Timesheet chờ</h3>
                <h1>8</h1>
            </div>
            <div class="card">
                <h3>Đơn nghỉ</h3>
                <h1>3</h1>
            </div>
        </div>

        <div class="table">
            <h3>Timesheet chờ duyệt</h3>
            <table>
                <tr>
                    <th>Nhân viên</th>
                    <th>Ngày</th>
                    <th>Giờ</th>
                </tr>
                <tr>
                    <td>A</td>
                    <td>1/3</td>
                    <td>8h</td>
                </tr>
            </table>
        </div>

    </div>

</body>

</html>
