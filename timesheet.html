<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bảng công</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6f9;
        }

        /* HEADER */
        .header {
            background: #1e2a38;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
        }

        /* LAYOUT */
        .container {
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: #0f172a;
            color: white;
            height: 100vh;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            padding: 10px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #1e293b;
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #f1f5f9;
        }

        .status {
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .approved {
            background: #dcfce7;
            color: #166534;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        /* POPUP */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 300px;
        }

        .popup-box h3 {
            margin-bottom: 10px;
        }

        .popup-box button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <div>Timesheet System</div>
        <div>Xin chào, User</div>
    </div>

    <div class="container">
        <div class="sidebar">
            <a href="#">Dashboard</a>
            <a href="#">Chấm công</a>
            <a href="#">Xin nghỉ phép</a>
            <a href="#">Lịch sử</a>
        </div>

        <div class="content">
            <h2>Bảng công của tôi</h2>

            <div class="card">
                <table>
                    <tr>
                        <th>Ngày</th>
                        <th>Check-in</th>
                        <th>Check-out</th>
                        <th>Tổng giờ</th>
                        <th>Trạng thái</th>
                    </tr>
                    <tr>
                        <td>03/03/2026</td>
                        <td>08:00</td>
                        <td>17:00</td>
                        <td>8h</td>
                        <td>
                            <span id="statusText" class="status pending">Chờ xác nhận</span>
                        </td>
                    </tr>
                </table>

                <button class="btn" onclick="confirmTimesheet()">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- POPUP -->
    <div id="popup" class="popup hidden">
        <div class="popup-box">
            <h3>✔ Thành công</h3>
            <p>Bạn đã xác nhận bảng công!</p>
            <button onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        function confirmTimesheet() {
            document.getElementById("successModal").style.display = "flex";
        }

        function closeModal() {
            // Ẩn modal
            document.getElementById("successModal").style.display = "none";

            // Chuyển sang dashboard
            window.location.href = "dashboard.html";
        }
    </script>

</body>

</html>
